<!doctype html>
<html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Noemorph · Run settings</title><link rel="stylesheet" href="styles.css"></head>
<body class="run-card-page"><main class="run-card-shell"><header class="run-card-header"><a class="card-brand" href="#">Noemorph</a><div class="language-switch" aria-label="界面语言"><button data-card-lang="zh-CN" aria-pressed="true">中</button><button data-card-lang="en" aria-pressed="false">EN</button></div></header><div class="eyebrow">NOEMORPH / RESEARCH SETUP</div><h1>开始前，选择你的探索方式。</h1><p class="setting-note">界面语言与内容语言独立设置。</p><div id="run-settings-root"></div></main>
<script id="run-card-data" type="application/json">{}</script><script src="i18n.js"></script><script src="settings.js"></script><script>
(function(){const I=window.NoemorphI18n,boot=JSON.parse(document.getElementById('run-card-data').textContent);I.setLanguage(boot.config?.ui_language||'zh-CN');const options=boot.endpoint?{onSubmit:async value=>{const response=await fetch(boot.endpoint,{method:'POST',headers:{'Content-Type':'application/json','X-Noemorph-Token':boot.token},body:JSON.stringify(value)});if(!response.ok)throw new Error(await response.text());}}:{};const card=window.NoemorphSettings.mount(document.getElementById('run-settings-root'),boot.config||{},options);function sync(){I.applyStatic(document);document.querySelectorAll('[data-card-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.cardLang===I.getLanguage())));card.refresh();}document.querySelectorAll('[data-card-lang]').forEach(button=>button.addEventListener('click',()=>{I.setLanguage(button.dataset.cardLang);sync();}));sync();})();
</script></body></html>
